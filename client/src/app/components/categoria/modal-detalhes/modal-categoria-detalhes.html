<!-- Fundo do modal -->
<div class="archive-modal-backdrop" (click)="fecharModal()">

    <!-- Modal de detalhes -->
    <section class="archive-modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo"
        (click)="$event.stopPropagation()">

        <!-- Cabeçalho -->
        <div class="modal-topline">
            <span>NOTEKEEPER / ARQUIVO PESSOAL</span>

            <button type="button" class="modal-close" aria-label="Fechar detalhes" (click)="fecharModal()">
                ×
            </button>
        </div>

        <!-- Símbolo -->
        <div class="modal-symbol" aria-hidden="true">
            §
        </div>

        <p class="modal-eyebrow">
            Departamento de catalogação
        </p>

        <h2 id="modal-titulo" class="modal-title">
            Detalhes da categoria
        </h2>

        <p class="modal-description">
            Consulte os dados registrados nesta ficha do seu arquivo pessoal.
        </p>

        <div class="record-divider"></div>


        <!-- Rodapé -->
        <div class="modal-footer">
            <p>
                Todo assunto merece seu próprio lugar.
            </p>
        </div>

        <!-- Ações -->
        <div class="modal-actions">
            <button type="button" class="modal-cancel" (click)="fecharModal()">
                <span aria-hidden="true">←</span>
                Voltar ao arquivo
            </button>
        </div>

    </section>
</div>
