<div class="w-full">

    <!-- Cabeçalho -->
    <div class="mb-8">
        <p class="mb-3 text-[10px] font-semibold uppercase tracking-[0.25em] text-[#8B7547]">
            Comece sua coleção
        </p>

        <h2 class="font-serif text-4xl leading-tight text-[#30271F]">
            Crie sua conta
        </h2>

        <p class="mt-3 text-sm leading-6 text-[#786A56]">
            Prepare seu espaço pessoal para registrar e preservar suas ideias.
        </p>
    </div>

    <!-- Formulário -->
    <form class="space-y-5" (submit)="$event.preventDefault(); enviarFormulario()">

        <!-- Nome -->
        <div>
            <label for="nome" class="mb-2 block text-xs font-semibold uppercase tracking-wider text-[#514332]">
                Nome completo
            </label>

            <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Como podemos chamar você?"
                required maxlength="100" [value]="formulario().nome" (input)="formulario.update(f => ({
          ...f,
          nome: $any($event.target).value
        }))"
                class="w-full border border-[#D4C5AA] bg-[#F4EAD8] px-4 py-3.5 text-sm text-[#30271F] outline-none transition placeholder:text-[#A3957E] focus:border-[#8B7547] focus:ring-1 focus:ring-[#8B7547]" />
        </div>

        <!-- E-mail -->
        <div>
            <label for="email" class="mb-2 block text-xs font-semibold uppercase tracking-wider text-[#514332]">
                E-mail
            </label>

            <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required
                [value]="formulario().email" (input)="formulario.update(f => ({
          ...f,
          email: $any($event.target).value
        }))"
                class="w-full border border-[#D4C5AA] bg-[#F4EAD8] px-4 py-3.5 text-sm text-[#30271F] outline-none transition placeholder:text-[#A3957E] focus:border-[#8B7547] focus:ring-1 focus:ring-[#8B7547]" />
        </div>

        <!-- Senha -->
        <div>
            <label for="senha" class="mb-2 block text-xs font-semibold uppercase tracking-wider text-[#514332]">
                Senha
            </label>

            <input id="senha" name="senha" type="password" autocomplete="new-password"
                placeholder="Crie uma senha segura" required minlength="8" [value]="formulario().senha" (input)="formulario.update(f => ({
          ...f,
          senha: $any($event.target).value
        }))"
                class="w-full border border-[#D4C5AA] bg-[#F4EAD8] px-4 py-3.5 text-sm text-[#30271F] outline-none transition placeholder:text-[#A3957E] focus:border-[#8B7547] focus:ring-1 focus:ring-[#8B7547]" />

            <p class="mt-2 text-xs leading-5 text-[#786A56]">
                Use pelo menos 8 caracteres, incluindo um número e um símbolo.
            </p>
        </div>

        <!-- Erro da API -->
        @if (mensagemErro()) {
        <div role="alert"
            class="border-l-2 border-[#75453B] bg-[#75453B]/10 px-4 py-3 text-sm leading-6 text-[#75453B]">
            {{ mensagemErro() }}
        </div>
        }

        <!-- Botão de cadastro -->
        <button type="submit" [disabled]="carregando()"
            class="flex w-full items-center justify-center gap-3 bg-[#263A30] px-5 py-4 text-sm font-semibold tracking-wide text-[#F4EAD8] transition hover:bg-[#354638] focus:outline-none focus:ring-2 focus:ring-[#8B7547] focus:ring-offset-2 focus:ring-offset-[#E9DFC9] disabled:cursor-not-allowed disabled:opacity-60">
            @if (carregando()) {
            <span class="h-4 w-4 animate-spin rounded-full border-2 border-[#F4EAD8]/40 border-t-[#F4EAD8]"></span>

            Criando sua conta...
            } @else {
            Criar minha conta
            <span aria-hidden="true">→</span>
            }
        </button>

    </form>

    <!-- Divisor decorativo -->
    <div class="my-7 flex items-center gap-4">
        <div class="h-px flex-1 bg-[#D4C5AA]"></div>
        <span class="text-xs text-[#8B7547]">✦</span>
        <div class="h-px flex-1 bg-[#D4C5AA]"></div>
    </div>

    <!-- Link para login -->
    <p class="text-center text-sm text-[#786A56]">
        Já possui uma conta?

        <a routerLink="/login"
            class="ml-1 font-semibold text-[#354638] underline decoration-[#B89A65] underline-offset-4 transition hover:text-[#75453B]">
            Entrar no seu arquivo
        </a>
    </p>

</div>
